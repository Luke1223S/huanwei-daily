  :root {

  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    line-height: 1.65; padding-bottom: 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 14px; }

  header { text-align: center; padding: 14px 0 6px; }
  header h1 { font-size: 21px; letter-spacing: 1px; }
  header .range { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .total-band {
    display: flex; justify-content: center; gap: 18px; margin: 14px auto 6px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 10px; max-width: 460px;
  }
  .total-band .tb { text-align: center; }
  .total-band .num { font-size: 22px; font-weight: 700; color: var(--blue); }
  .total-band .lbl { font-size: 11.5px; color: var(--dim); }
  .total-band .num.gold { color: var(--gold); }

  .tip {
    text-align: center; color: var(--dim); font-size: 12px;
    margin: 8px auto 2px; max-width: 460px;
  }

  /* ===== 一级：区域卡片 ===== */
  .region-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 15px 16px; margin: 12px 0; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: transform .12s ease;
  }
  .region-card:active { transform: scale(.985); }
  .region-card.key {
    border: 1.5px solid var(--gold-bd);
    background: linear-gradient(135deg, rgba(245,197,66,0.09), rgba(245,197,66,0.02));
  }
  .rc-num {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; background: #1d222c; border: 1px solid var(--border);
  }
  .region-card.key .rc-num { background: var(--gold-bg); border-color: var(--gold-bd); }
  .rc-main { flex: 1; min-width: 0; }
  .rc-name { font-size: 16px; font-weight: 700; }
  .rc-name .emoji { margin-right: 5px; }
  .region-card.key .rc-name { color: var(--gold); }
  .rc-prov { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px; color: var(--dim); background: #1d222c;
    border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px;
    cursor: pointer; transition: color .12s ease, border-color .12s ease;
  }
  .chip:hover { color: var(--blue); border-color: var(--blue-bd); background: var(--blue-bg); }
  .region-card.key .chip { background: rgba(245,197,66,0.08); border-color: rgba(245,197,66,0.25); color: #d8b85a; }
  .rc-count {
    flex-shrink: 0; text-align: center; background: var(--blue-bg);
    border: 1px solid var(--blue-bd); border-radius: 10px; padding: 5px 11px;
  }
  .rc-count .n { font-size: 18px; font-weight: 700; color: var(--blue); line-height: 1.2; }
  .rc-count .t { font-size: 10.5px; color: var(--dim); }
  .region-card.key .rc-count { background: var(--gold-bg); border-color: var(--gold-bd); }
  .region-card.key .rc-count .n { color: var(--gold); }
  .rc-arrow { color: var(--dim); font-size: 16px; flex-shrink: 0; }

  /* ===== 二级/三级 ===== */
  #detail { display: none; }
  .back-bar { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; flex-wrap: wrap; }
  .back-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 7px 14px; font-size: 13.5px; cursor: pointer;
  }
  .copy-btn {
    background: var(--blue-bg); border: 1px solid var(--blue-bd); color: var(--blue);

  .detail-title.key { color: var(--gold); }
  .detail-sub { color: var(--dim); font-size: 12.5px; padding: 0 2px 8px; }

  .prov-head .pc {

  .prov-cnt { font-size: 12px; color: var(--dim); }
  .prov-cnt b { color: #7dd3fc; font-weight: 600; }
  .prov-head.key-prov .prov-cnt b { color: var(--gold); }
  .prov-link {
    margin-left: auto; font-size: 11.5px; color: var(--blue); background: var(--blue-bg);
    border: 1px solid var(--blue-bd); border-radius: 8px; padding: 2px 9px; cursor: pointer;
  }

  .cat-head {
    margin: 14px 0 2px; font-size: 13.5px; font-weight: 700; color: #7dd3fc;
    border-left: 3px solid var(--blue); padding-left: 8px; line-height: 1.5;

  .cat-head .cn { font-weight: 400; color: var(--dim); font-size: 11.5px; margin-left: 6px; }

  .item-title { font-size: 14.5px; font-weight: 600; line-height: 1.5; }
  .badge {

  .b-zb { background: rgba(77,159,255,.15); color: var(--blue); border: 1px solid var(--blue-bd); }
  .b-cs { background: rgba(167,139,250,.15); color: #a78bfa; border: 1px solid rgba(167,139,250,.4); }
  .b-zd { background: rgba(245,197,66,.13); color: var(--gold); border: 1px solid var(--gold-bd); }
  .b-gz { background: rgba(248,113,113,.13); color: #f87171; border: 1px solid rgba(248,113,113,.35); }
  .item-meta { font-size: 12.5px; color: var(--dim); margin-top: 5px; }
  .item-meta b { color: #7dd3fc; font-weight: 600; }
  .item-brief { font-size: 12.5px; color: var(--dim); margin-top: 5px; }
  .item-brief .bl { color: #b6c2d9; }
  .item-link {
    display: inline-block; margin-top: 8px; font-size: 12.5px; color: var(--blue);

  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(52,211,153,.15); color: var(--green); border: 1px solid rgba(52,211,153,.4);

  }

  footer { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: 30px; line-height: 1.9; }

<script>
const DATA_DATE = window.DASHBOARD_DATA.date;
const REGIONS = window.DASHBOARD_DATA.regions;

const TYPE_BADGE = { "意向":"b-yx", "需求公示":"b-yx", "招标":"b-zb", "磋商":"b-cs", "谈判":"b-cs", "单一来源":"b-cs", "中标":"b-zd", "更正":"b-gz" };
// 分类排序：0 采购需求(意向/需求公示) → 1 招标公告(招标/磋商/谈判/单一来源) → 2 中标公告 → 3 更正公告
function cat(y){
  if (y==="意向" || y==="需求公示") return { k:0, n:"采购需求公示" };
  if (y==="中标") return { k:2, n:"中标公告" };
  if (y==="更正") return { k:3, n:"更正公告" };
  return { k:1, n:"招标公告" };
}
const CAT_ORDER = ["采购需求公示","招标公告","中标公告","更正公告"];
function sortedItems(items){
  return items.slice().sort((a,b)=>cat(a.y).k - cat(b.y).k);
}
function provCountLine(items){
  const cnt = {};
  items.forEach(i=>{ const c = cat(i.y).n; cnt[c] = (cnt[c]||0)+1; });
  return CAT_ORDER.filter(n=>cnt[n]).map(n=>`<b>${n}${cnt[n]}条</b>`).join("丨");
}
function countRegion(r){ return r.provinces.reduce((s,p)=>s+p.items.length,0); }
function countAll(){ return REGIONS.reduce((s,r)=>s+countRegion(r),0); }
function countKey(){ const r = REGIONS.find(r=>r.key); return r?countRegion(r):0; }
function countYx(){ let n=0; REGIONS.forEach(r=>r.provinces.forEach(p=>p.items.forEach(i=>{ if(i.y==="意向"||i.y==="需求公示") n++; }))); return n; }
function findRegion(slug){ return REGIONS.find(r=>r.slug===slug); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(()=>{ t.style.display = "none"; }, 1800);
}
function copyLink(url){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(()=>toast("✅ 链接已复制")).catch(()=>toast("🔗 " + url));
  } else { toast("🔗 " + url); }
}
function copyCurrentLink(){ copyLink(location.href); }

function renderHome(){
  document.getElementById("dateLine").textContent = "公告发布日期：" + DATA_DATE;
  document.getElementById("sumKey").textContent = countKey();
  document.getElementById("sumAll").textContent = countAll();
  document.getElementById("sumYx").textContent = countYx();
  const home = document.getElementById("home");
  home.innerHTML = "";
  REGIONS.forEach((r)=>{
    const total = countRegion(r);
    const chips = r.provinces.map(p=>`<span class="chip chip-go" data-r="${r.slug}" data-p="${encodeURIComponent(p.name)}" title="点击查看${p.name}公告明细">${p.name} ${p.items.length}条 ›</span>`).join("");
    const card = document.createElement("div");
    card.className = "region-card" + (r.key?" key":"");
    card.onclick = ()=>{ location.hash = "r=" + r.slug; };
    card.innerHTML = `
      <div class="rc-num">${r.num}</div>
      <div class="rc-main">
        <div class="rc-name"><span class="emoji">${r.emoji}</span>${r.key?"★ ":""}${r.name}</div>
        <div class="rc-prov">${chips}</div>
      </div>
      <div class="rc-count"><div class="n">${total}</div><div class="t">条公告</div></div>
      <div class="rc-arrow">›</div>`;
    card.querySelectorAll(".chip-go").forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); location.hash = "r=" + el.getAttribute("data-r") + "&p=" + el.getAttribute("data-p"); };
    });
    home.appendChild(card);
  });
}

function itemHTML(i){
  const badgeCls = TYPE_BADGE[i.y] || "b-cs";
  const dur = (i.d || "期限：未公布").replace(/^期限：/, "");
  let amount;
  if (i.a) {
    amount = `<b>年化 ${i.a}</b>` + (i.m && i.m !== i.a ? ` ｜ 总额 ${i.m}` : "");
  } else {
    amount = `<b>${i.m || "金额：未公布"}</b>`;
  }
  return `
    <div class="item">
      <div class="item-title"><span class="badge ${badgeCls}">${i.y}</span>${i.t}</div>
      <div class="item-meta">${amount} ｜ 服务时长：${dur}</div>
      <div class="item-brief"><span class="bl">简介：</span>${i.brief}</div>
      <a class="item-link" href="${i.url}" target="_blank">查看公告原文 ↗</a>
    </div>`;
}

function renderProvBlock(region, prov){
  const block = document.createElement("div");
  block.className = "prov-block";
  const provUrl = location.origin + location.pathname + "#r=" + region.slug + "&p=" + encodeURIComponent(prov.name);
  const head = document.createElement("div");
  head.className = "prov-head" + (region.key?" key-prov":"");
  head.innerHTML = `<span class="prov-name">📍${prov.name}</span>
    <span class="pc">${prov.items.length}条</span>
    <span class="prov-cnt">${provCountLine(prov.items)}</span>
    <span class="prov-link" data-url="${provUrl}">🔗 省专属链接</span>`;
  head.querySelector(".prov-link").onclick = (e)=>copyLink(e.target.getAttribute("data-url"));
  block.appendChild(head);
  const groups = {};
  sortedItems(prov.items).forEach(i=>{ const c = cat(i.y).n; (groups[c]=groups[c]||[]).push(i); });
  CAT_ORDER.forEach(name=>{
    const arr = groups[name];
    if (!arr || !arr.length) return;
    const sec = document.createElement("div");
    sec.className = "cat-sec";
    const secHead = document.createElement("div");
    secHead.className = "cat-head";
    secHead.innerHTML = `${name}<span class="cn">${arr.length}条</span>`;
    sec.appendChild(secHead);
    arr.forEach(i=>{ sec.insertAdjacentHTML("beforeend", itemHTML(i)); });
    block.appendChild(sec);
  });
  return block;
}

function showDetail(region, provName){
  document.getElementById("home").style.display = "none";
  const detail = document.getElementById("detail");
  detail.style.display = "block";
  const dTitle = document.getElementById("dTitle");
  const dBody = document.getElementById("dBody");

  if (provName) {
    const prov = region.provinces.find(p=>p.name===provName);
    if (!prov) { location.hash = "r=" + region.slug; return; }
    dTitle.textContent = region.num + " " + region.emoji + " " + region.name + " · " + provName;
    dTitle.className = "detail-title" + (region.key?" key":"");
    document.getElementById("dSub").textContent = "公告发布日期：" + DATA_DATE + " · " + provName + " 共" + prov.items.length + "条 · 按【采购需求公示 → 招标公告 → 中标公告】分组展示";
    dBody.innerHTML = "";
    dBody.appendChild(renderProvBlock(region, prov));
    document.getElementById("backBtn").textContent = "← 返回" + region.name;
  } else {
    const total = countRegion(region);
    dTitle.textContent = region.num + " " + region.emoji + " " + region.name + " · 共" + total + "条";
    dTitle.className = "detail-title" + (region.key?" key":"");
    document.getElementById("dSub").textContent = "公告发布日期：" + DATA_DATE + " · 每省内按【采购需求公示 → 招标公告 → 中标公告】分组 · 点击省名标签可直接跳转该省";
    dBody.innerHTML = "";
    region.provinces.forEach(p=>{ dBody.appendChild(renderProvBlock(region, p)); });
    document.getElementById("backBtn").textContent = "← 返回区域总览";
  }
  window.scrollTo(0,0);
}

function route(){
  const params = new URLSearchParams(location.hash.slice(1));
  const rSlug = params.get("r");
  const pName = params.get("p");
  if (!rSlug) { goHomeView(); return; }
  const region = findRegion(rSlug);
  if (!region) { goHomeView(); return; }
  showDetail(region, pName);
}
function goHomeView(){
  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";
  window.scrollTo(0,0);
}
function routeBack(){
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get("p")) { location.hash = "r=" + params.get("r"); }
  else { location.hash = ""; }
}
window.addEventListener("hashchange", route);

renderHome();
route();
</script>
